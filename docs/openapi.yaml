# ETL Platform OpenAPI 3.0 Specification
# This file describes the ETL API v2 endpoints. It can be imported into
# Swagger UI, Postman, or any OpenAPI-compatible tool.
# Served at: /api/v2/ (base path)

openapi: 3.0.3
info:
  title: Sync Canal ETL API
  version: "3.0"
  description: |
    Declarative ETL/CDC platform API for pipeline management, monitoring,
    dead-letter queue operations, and plugin management.
    
    ## Authentication
    All endpoints require `X-API-Token` header or `Authorization: Bearer <token>`.
    The token is set via `ETL_API_TOKEN` environment variable.

servers:
  - url: http://localhost:8000/api/v2
    description: Local development
  - url: /api/v2
    description: Same-origin (via reverse proxy)

security:
  - ApiToken: []

components:
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: X-API-Token
  schemas:
    OutputCompactResult:
      type: object
      properties:
        dry_run: { type: boolean }
        groups:
          type: array
          items:
            type: object
            properties:
              day: { type: string }
              merged_key: { type: string }
              manifest_key: { type: string }
              replaced_keys: { type: array, items: { type: string } }
              source_batch_ids: { type: array, items: { type: string } }
              rows: { type: integer }
              bytes_before: { type: integer }
              bytes_after: { type: integer }
        skipped_groups: { type: integer }
        objects_considered: { type: integer }
        objects_after: { type: integer }
        bytes_before: { type: integer }
        bytes_after: { type: integer }
        compacted_at: { type: string, format: date-time }
        committed_via: { type: string, enum: [compaction_manifest] }
    ReconcileReport:
      type: object
      required: [pipeline_id, source, target, deep, buckets, tables, summary, verdict, limits]
      properties:
        pipeline_id: { type: string }
        pipeline_name: { type: string }
        pipeline_status: { type: string }
        source: { $ref: '#/components/schemas/ReconcileSideInfo' }
        target: { $ref: '#/components/schemas/ReconcileSideInfo' }
        deep: { type: boolean }
        buckets: { type: integer }
        verdict:
          type: string
          enum: [match, count_mismatch, content_mismatch, schema_mismatch, missing_target_table, unsupported, error]
        tables:
          type: array
          items: { $ref: '#/components/schemas/ReconcileTableReport' }
        summary:
          type: object
          properties:
            tables: { type: integer }
            matched: { type: integer }
            count_mismatch: { type: integer }
            content_mismatch: { type: integer }
            schema_mismatch: { type: integer }
            errors: { type: integer }
            unsupported: { type: integer }
        limits:
          type: array
          items: { type: string }
          description: Explicit boundaries of the comparison; the report is not an exactly-once proof.
        started_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time }
        duration_ms: { type: integer, format: int64 }
    ReconcileSideInfo:
      type: object
      properties:
        role: { type: string, enum: [source, target] }
        type: { type: string }
        dialect: { type: string, enum: [mysql, doris, postgres, clickhouse] }
        database: { type: string }
        endpoint: { type: string }
    ReconcileTableReport:
      type: object
      required: [source_table, target_table, verdict, source_rows, target_rows]
      properties:
        source_table: { type: string }
        target_table: { type: string }
        verdict:
          type: string
          enum: [match, count_mismatch, content_mismatch, schema_mismatch, missing_target_table, unsupported, error]
        source_rows: { type: integer, format: int64 }
        target_rows: { type: integer, format: int64 }
        row_delta: { type: integer, format: int64 }
        source_digest: { type: string }
        target_digest: { type: string }
        compared_columns: { type: array, items: { type: string } }
        target_columns_used: { type: array, items: { type: string } }
        missing_target_columns: { type: array, items: { type: string } }
        extra_target_columns: { type: array, items: { type: string } }
        bucket_key: { type: string }
        buckets: { type: integer }
        bucket_mismatches:
          type: array
          items:
            type: object
            properties:
              bucket: { type: integer }
              source_rows: { type: integer, format: int64 }
              target_rows: { type: integer, format: int64 }
              source_digest: { type: string }
              target_digest: { type: string }
        bucket_scan_truncated: { type: boolean }
        detail: { type: string }
        duration_ms: { type: integer, format: int64 }
    PipelineSpec:
      type: object
      properties:
        name: { type: string, example: "mysql-to-clickhouse" }
        source: { $ref: '#/components/schemas/PluginConfig' }
        sink: { $ref: '#/components/schemas/PluginConfig' }
        transforms:
          type: array
          items: { $ref: '#/components/schemas/PluginConfig' }
        batch_size: { type: integer, default: 1000 }
        flush_interval_ms: { type: integer, default: 1000 }
        checkpoint_interval_sec: { type: integer, default: 30 }
        parallelism:
          type: object
          properties:
            sharding:
              type: object
              properties:
                strategy: { type: string, enum: [round_robin, pk_mod, hash_modulo, partition, id_range, table] }
                key: { type: string }
                logical_shards: { type: integer }
            execution:
              type: object
              properties:
                max_active_shards: { type: integer }
                transform_workers: { type: integer }
                sink_concurrency: { type: integer }
            count: { type: integer, deprecated: true }
            shard_strategy: { type: string, enum: [round_robin, partition, id_range, table], deprecated: true }
    PluginConfig:
      type: object
      properties:
        type: { type: string, example: "mysql_cdc" }
        config: { type: object }
    PipelineStatus:
      type: object
      properties:
        id: { type: string, description: Pipeline instance UUID }
        name: { type: string }
        status: { type: string, enum: [running, stopped, failed, paused, completed, scheduled, restore_failed] }
        desired_state:
          type: string
          enum: [running, stopped, paused]
          description: Durable operator intent used as the startup source of truth.
        observed_state:
          type: string
          enum: [starting, running, stopped, paused, scheduled, failed, completed, restore_failed]
          description: Last persisted runtime observation; status remains a compatibility field.
        generation:
          type: integer
          format: int64
          description: Monotonic pipeline execution/checkpoint fencing token.
        restore_error:
          $ref: '#/components/schemas/RestoreFailure'
        stats:
          type: object
          properties:
            records_read: { type: integer }
            records_written: { type: integer }
            records_failed: { type: integer }
            records_dlq: { type: integer }
            started_at: { type: string, format: date-time }
            uptime: { type: string }
            last_error: { type: string }
            last_error_code: { type: string, description: Stable machine-readable failure category }
            last_error_remediation: { type: string, description: Safe operator next step; checkpoint reset is not implied }
    RestoreFailure:
      type: object
      required: [pipeline_id, pipeline_name, stage, code, message, remediation, previous_status, failed_at]
      properties:
        pipeline_id: { type: string }
        pipeline_name: { type: string }
        stage:
          type: string
          enum: [dag_yaml_parse, linear_yaml_parse, dag_connection_resolve, linear_connection_resolve, spec_validate, runner_build]
        code: { type: string, example: pipeline_restore.runner_build }
        message: { type: string }
        remediation: { type: string }
        previous_status: { type: string }
        failed_at: { type: string, format: date-time }
    MetricsResponse:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        pipelines:
          type: array
          items:
            $ref: '#/components/schemas/PipelineMetrics'
    PipelineMetrics:
      type: object
      properties:
        id: { type: string, description: Pipeline instance UUID }
        name: { type: string }
        status: { type: string }
        records_read: { type: integer, format: int64 }
        records_written: { type: integer, format: int64 }
        records_failed: { type: integer, format: int64 }
        records_dlq: { type: integer, format: int64 }
        last_error: { type: string }
        last_error_code: { type: string }
        last_error_remediation: { type: string }
        checkpoint_fenced_total:
          type: integer
          format: int64
          description: Checkpoint writes rejected because their execution generation was stale.
        state_metrics:
          type: array
          items:
            $ref: '#/components/schemas/StateMetric'
        transform_metrics:
          type: array
          items:
            $ref: '#/components/schemas/TransformMetric'
    StateMetric:
      type: object
      properties:
        node: { type: string, example: "window-orders" }
        keys: { type: integer, example: 7 }
        bytes: { type: integer, format: int64, example: 512 }
        updated_at: { type: string, format: date-time }
    TransformMetric:
      type: object
      properties:
        node: { type: string, example: "join-orders" }
        transform: { type: string, example: "join" }
        counters:
          type: object
          additionalProperties:
            type: integer
            format: int64
          example:
            hit: 10
            miss: 2
            miss_dropped: 1
            miss_dlq: 1
    CheckpointResetSemantics:
      type: object
      required: [source, effect, external_boundary, operator_action]
      properties:
        source: { type: string, description: Source type; built-in reset contracts include kafka, mysql_cdc, mysql_snapshot_cdc, and postgres_cdc. }
        effect: { type: string, description: The OpenETL checkpoint state changed by this operation. }
        external_boundary: { type: string, description: Broker/database state that reset does not change. }
        operator_action: { type: string, description: Safe source-specific replay guidance. }
    PipelineNotQuiescent:
      type: object
      required: [error, code, remediation]
      properties:
        error: { type: string }
        code: { type: string, enum: [pipeline_not_quiescent] }
        remediation: { type: string }
    DLQIdentityContext:
      type: object
      required: [replay_provenance, replay_state]
      properties:
        raw_payload: { type: string, description: Exact UTF-8 source bytes or base64 according to payload_encoding. }
        payload_encoding: { type: string, enum: [source_bytes, source_bytes_base64, normalized_data_json] }
        primary_key_columns: { type: array, items: { type: string } }
        failure_reason: { type: string }
        missing_columns: { type: array, items: { type: string } }
        format_contract_id: { type: string }
        before_image_state: { type: string, enum: [absent, null, empty_array, present_empty, partial, full, invalid] }
        source_database: { type: string }
        source_table: { type: string }
        target_database: { type: string }
        target_table: { type: string }
        replay_provenance: { type: string, enum: [normal_flow, contract_reconstructed, legacy_unknown, legacy_verified] }
        replay_state: { type: string, enum: [pending, repair_required, quarantined, sink_acked] }
        replay_attempt: { type: integer }
        replay_error: { type: string }
        sink_acknowledged_at: { type: string, format: date-time }
    DLQDryRunItem:
      type: object
      properties:
        id: { type: integer, format: int64 }
        dag_node: { type: string }
        replayable: { type: boolean }
        state: { type: string, description: Replay state when the row would be blocked. }
        reason: { type: string }
    DLQDryRunResult:
      type: object
      properties:
        dry_run: { type: boolean }
        replayable: { type: integer }
        blocked: { type: integer }
        items:
          type: array
          items: { $ref: '#/components/schemas/DLQDryRunItem' }
    DLQReplayGateError:
      type: object
      required: [error, id, replay_state, reason]
      properties:
        error: { type: string }
        replayed: { type: integer }
        id: { type: integer, format: int64 }
        replay_state: { type: string, enum: [repair_required, quarantined, sink_acked] }
        reason: { type: string }
    DLQIdentityRepairRequest:
      type: object
      additionalProperties: false
      required: [primary_key_columns]
      properties:
        primary_key_columns:
          type: array
          minItems: 1
          items: { type: string }

tags:
  - name: Pipelines
  - name: Checkpoints
  - name: DLQ
  - name: Plugins
  - name: Specs
  - name: Connections
  - name: Transforms
  - name: Monitoring
  - name: Audit
  - name: Schemas
  - name: Workers

paths:
  /pipelines:
    get:
      tags: [Pipelines]
      summary: List all pipelines
      description: Includes stored pipelines whose runner restore failed, with status restore_failed and a structured restore_error.
      responses:
        '200':
          description: Pipeline list
    post:
      tags: [Pipelines]
      summary: Create a new pipeline
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                spec: { $ref: '#/components/schemas/PipelineSpec' }
      responses:
        '200': { description: Created with a generated pipeline instance id }
    put:
      tags: [Pipelines]
      summary: Update an existing pipeline
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id: { type: string, description: Pipeline instance UUID. If omitted, a single matching legacy name may be used. }
                spec: { $ref: '#/components/schemas/PipelineSpec' }
                reset_checkpoint: { type: boolean }
      responses:
        '200': { description: Updated }

  /pipelines/{id}:
    get:
      tags: [Pipelines]
      summary: Get pipeline status
      description: The path value is the pipeline instance UUID. For backward compatibility, a display name is accepted only when it resolves to one instance. Restore failures remain queryable with status restore_failed and restore_error.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Pipeline status
    delete:
      tags: [Pipelines]
      summary: Delete pipeline
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Deleted }

  /pipelines/{id}/start:
    post:
      tags: [Pipelines]
      summary: Start pipeline
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Started }
        '409': { description: Runner is unavailable because the stored pipeline is restore_failed; response includes the structured restore_error. }

  /pipelines/{id}/stop:
    post:
      tags: [Pipelines]
      summary: Stop pipeline
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Stopped }

  /pipelines/{id}/pause:
    post:
      tags: [Pipelines]
      summary: Pause pipeline (suspend source reading, keep checkpoint)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Paused }

  /pipelines/{id}/resume:
    post:
      tags: [Pipelines]
      summary: Resume pipeline from pause
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Resumed }

  /pipelines/{id}/spec:
    get:
      tags: [Pipelines]
      summary: Get pipeline spec (secrets masked)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Spec with masked secrets }

  /pipelines/{id}/schedule:
    get:
      tags: [Pipelines]
      summary: Get pipeline schedule config
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Schedule config and enabled flag }
    put:
      tags: [Pipelines]
      summary: Create or update pipeline schedule config
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [type]
              properties:
                type: { type: string, enum: [streaming, once, cron, periodic, dependency] }
                cron: { type: string, description: Required when type=cron }
                interval_sec: { type: integer, description: Required when type=periodic }
                depends_on:
                  type: array
                  items: { type: string }
                  description: Required when type=dependency; upstream pipeline names/ids this pipeline waits for.
      responses:
        '200': { description: Schedule saved }
    delete:
      tags: [Pipelines]
      summary: Disable pipeline schedule config
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Schedule disabled }

  /pipelines/{id}/history:
    get:
      tags: [Pipelines]
      summary: Get pipeline run history
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Run history }

  /pipelines/{id}/log:
    get:
      tags: [Pipelines]
      summary: Get recent pipeline logs
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: since, in: query, schema: { type: integer } }
      responses:
        '200': { description: Log entries }

  /pipelines/{id}/shards:
    get:
      tags: [Pipelines]
      summary: Get per-shard stats
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Shard info }

  /pipelines/{id}/checkpoint/set:
    post:
      tags: [Pipelines, Checkpoints]
      summary: Set checkpoint position or Kafka replay offset
      description: Requires desired_state stopped or paused and a non-running runner. Atomically advances the pipeline generation and sets the checkpoint; stale in-flight writes are fenced.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                position:
                  type: object
                  description: Raw source checkpoint position for backward compatibility.
                source:
                  type: string
                  description: Source type. Use kafka for structured Kafka offset replay.
                source_type:
                  type: string
                  description: Alias for source.
                topic:
                  type: string
                  description: Kafka topic. Optional when the saved pipeline spec is a Kafka source with source.config.topic.
                partition:
                  type: integer
                  description: Kafka partition for single-partition replay.
                offset:
                  type: integer
                  format: int64
                  description: Kafka offset. With default mode=replay_from, replay resumes from this offset.
                offsets:
                  type: object
                  additionalProperties: { type: integer, format: int64 }
                  description: Kafka partition -> offset map. Defaults to last_committed mode unless mode=replay_from is specified.
                replay_from_offsets:
                  type: object
                  additionalProperties: { type: integer, format: int64 }
                  description: Kafka partition -> first offset to replay.
                mode:
                  type: string
                  enum: [replay_from, last_committed]
                  description: replay_from stores offset-1 so the next start reads the requested offset; last_committed stores offsets as-is.
      responses:
        '200':
          description: Checkpoint saved with the new generation and source reset semantics.
        '400': { description: Invalid checkpoint request }
        '409':
          description: Pipeline is still running.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineNotQuiescent' }

  /pipelines/{id}/checkpoint/reset:
    post:
      tags: [Pipelines, Checkpoints]
      summary: Reset OpenETL checkpoint using source-specific next-start semantics
      description: Requires desired_state stopped or paused and a non-running runner. Atomically advances the pipeline generation and deletes OpenETL checkpoint state. It does not reset Kafka consumer groups, MySQL binlog positions, PostgreSQL replication slots, or WAL retention.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Checkpoint reset; response identifies the new generation and the source-specific external boundary.
          content:
            application/json:
              schema:
                type: object
                required: [status, generation, reset_semantics]
                properties:
                  status: { type: string, enum: [reset] }
                  generation: { type: integer, format: int64 }
                  reset_semantics: { $ref: '#/components/schemas/CheckpointResetSemantics' }
        '409':
          description: Pipeline is still running.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineNotQuiescent' }

  /pipelines/{id}/resync:
    post:
      tags: [Pipelines, Checkpoints]
      summary: Re-run the snapshot phase for named tables of a mysql_snapshot_cdc pipeline
      description: |
        Targeted table re-synchronisation. Drops the per-table snapshot cursors of the named tables,
        keeps the existing binlog anchor as the new snapshot handoff, and sets the checkpoint phase
        back to snapshot. Tables that are not named keep their cursor and emit nothing on the next
        start. Requires a quiescent pipeline and a sink that absorbs re-delivered rows. Only
        mysql_snapshot_cdc sources have per-table snapshot cursors; use checkpoint/reset for a full
        re-snapshot.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                table: { type: string, description: Single table to re-snapshot. }
                tables:
                  type: array
                  items: { type: string }
                  description: Tables to re-snapshot. Combined with `table` and de-duplicated.
      responses:
        '200':
          description: Resync scheduled; the pipeline must be started for it to take effect.
          content:
            application/json:
              schema:
                type: object
                required: [status, generation, tables, semantics]
                properties:
                  status: { type: string, enum: [resync_scheduled] }
                  generation: { type: integer, format: int64 }
                  tables:
                    type: array
                    items: { type: string }
                  details:
                    type: object
                    properties:
                      tables: { type: array, items: { type: string } }
                      phase: { type: string, enum: [snapshot] }
                      binlog_anchor: { type: string, description: 'Reused handoff position, e.g. mysql-bin.000010:4242.' }
                      cleared_cursor_keys: { type: array, items: { type: string } }
                      kept_tables: { type: array, items: { type: string } }
                  semantics:
                    type: object
                    description: Operator-facing contract (effect, sink_requirement, cdc_anchor, checkpoint, scope).
                    additionalProperties: true
        '400':
          description: Unsupported source type, unknown table name, no checkpoint yet, or an unusable position.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: Pipeline is still running.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineNotQuiescent' }

  /pipelines/{id}/output/compact:
    post:
      tags: [Pipelines]
      summary: Compact committed file / object-store output for one day
      description: |
        Folds the committed data objects of a date partition into a single object and publishes a
        compaction manifest that retires the replaced keys (`replaces`). Readers resolve the committed
        view through the manifest set, so each row is visible exactly once; the replaced objects are
        not deleted, which keeps the operation reversible. Requires sink.config.manifest=true and an
        s3 / file_sink sink. This is a metadata rewrite, not an atomic multi-object commit.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                day: { type: string, description: "Date partition (yyyy/mm/dd/); empty = every day." }
                min_objects: { type: integer, default: 4, description: "Smallest group worth compacting." }
                max_objects: { type: integer, default: 32, description: "Objects merged into one." }
                max_object_bytes: { type: integer, default: 1048576, description: "Skip groups that already hold larger objects." }
                dry_run: { type: boolean, default: false }
      responses:
        '200':
          description: Compaction result (groups, replaced keys, byte deltas).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutputCompactResult' }
        '400':
          description: Sink is not s3/file_sink, manifest is disabled, or the pass failed.
  /pipelines/{id}/reconcile:
    get:
      tags: [Pipelines, Verification]
      summary: Describe the supported reconciliation matrix and limits
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Supported sources, sinks, verdicts, request shape, and limits.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      tags: [Pipelines, Verification]
      summary: Compare source and target tables (row count, content digest, bucket drift)
      description: |
        On-demand, read-only data verification. Per table it compares row counts, then a content
        digest over the columns both sides share, then - when the sides disagree and the table has a
        single numeric key - a bucketed digest comparison that localises the drifted key range. Both
        ends must expose a SQL query surface (mysql_batch/mysql_cdc/mysql_snapshot_cdc or
        postgres_cdc against mysql/doris/clickhouse/postgres). Pipelines that declare transforms are
        rejected because transformed fields cannot be aligned column by column.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                tables:
                  type: array
                  items: { type: string }
                  description: Subset of configured source tables to compare. Unknown names are rejected.
                deep: { type: boolean, default: true, description: 'Compute content digests; false compares row counts only.' }
                buckets: { type: integer, default: 16, minimum: 1, maximum: 64 }
                key_columns:
                  type: object
                  additionalProperties: { type: string }
                  description: Per-table numeric key override used for bucket localisation.
                timeout_sec: { type: integer, default: 60, description: Per-table comparison timeout. }
      responses:
        '200':
          description: Reconciliation report.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReconcileReport' }
        '400':
          description: Unsupported source/sink pair, transform pipeline, unknown table, or a connection failure.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /metrics:
    get:
      tags: [Monitoring]
      summary: Get JSON metrics for all pipelines
      responses:
        '200':
          description: Metrics JSON
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricsResponse'

  /health:
    get:
      tags: [Monitoring]
      summary: Health check (returns 503 if unhealthy)
      security: []
      responses:
        '200': { description: Healthy }
        '503': { description: Unhealthy }

  /dlq/{id}:
    get:
      tags: [DLQ]
      summary: List dead-letter records
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: Pipeline instance UUID; a unique legacy display name is accepted for compatibility. }
        - { name: limit, in: query, schema: { type: integer }, description: Page size (default 100). }
        - { name: offset, in: query, schema: { type: integer }, description: Rows to skip. Listings are newest-first. }
        - { name: contains, in: query, schema: { type: string }, description: Substring match on the serialized record; LIKE wildcards in the value are escaped. }
        - { name: error_contains, in: query, schema: { type: string }, description: Substring match on the error string. }
        - { name: error_class, in: query, schema: { type: string }, description: Exact match on the indexed error_class column. }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
      responses:
        '200': { description: DLQ items, including stable id, attempt, record_hash, frozen identity_context, and dag_node when available }
    delete:
      tags: [DLQ]
      summary: Delete DLQ records
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: error_class, in: query, schema: { type: string } }
        - { name: contains, in: query, schema: { type: string } }
        - { name: error_contains, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: until, in: query, schema: { type: string, format: date-time } }
      responses:
        '200':
          description: Deleted. With no selective filter every row for the pipeline is removed and the response reports the real count.
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: integer, description: Number of rows actually deleted (never a -1 sentinel). }

  /dlq/{id}/replay:
    post:
      tags: [DLQ]
      summary: Replay DLQ records
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: dry_run, in: query, schema: { type: boolean }, description: Preview the identity gate per row without writing to the sink or mutating DLQ state. }
        - { name: contains, in: query, schema: { type: string } }
        - { name: error_class, in: query, schema: { type: string } }
      responses:
        '200':
          description: Replayed, or the dry-run preview when dry_run=1.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      replayed: { type: integer }
                  - $ref: '#/components/schemas/DLQDryRunResult'
        '400': { description: DAG DLQ replay requires dag_node context; or a concurrent replay is already running; or the pipeline needs allow_unsafe for its duplicate boundary }
        '409':
          description: Identity cannot be proven; the row remains repair-required or quarantined
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DLQReplayGateError' }

  /dlq/{pipeline_id}/{id}:
    delete:
      tags: [DLQ]
      summary: Delete one DLQ record by stable ID
      parameters:
        - { name: pipeline_id, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Deleted }

  /dlq/{pipeline_id}/{id}/replay:
    post:
      tags: [DLQ]
      summary: Replay one DLQ record by stable ID
      parameters:
        - { name: pipeline_id, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        '200': { description: Replayed }
        '400': { description: DAG DLQ replay requires dag_node context on legacy records }
        '409':
          description: Identity cannot be proven; the row remains repair-required or quarantined
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DLQReplayGateError' }

  /dlq/{pipeline_id}/{id}/identity:
    put:
      tags: [DLQ]
      summary: Verify and repair one legacy metadata-PK identity
      description: Requires an original primary-key declaration in the historical row and an exactly matching sink.config.pk_columns safety set. Never invents keys from current source configuration and rejects legacy primary-key-changing UPDATEs.
      parameters:
        - { name: pipeline_id, in: path, required: true, schema: { type: string } }
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DLQIdentityRepairRequest' }
      responses:
        '200': { description: Repaired row with legacy_verified identity context }
        '400': { description: Invalid request or pipeline does not enable the controlled compatibility path }
        '404': { description: DLQ row not found }
        '409':
          description: Declaration/value proof failed; row remains repair-required or quarantined
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DLQReplayGateError' }

  /connections:
    get:
      tags: [Connections]
      summary: List saved reusable connections with secret fields masked
      responses:
        '200': { description: Connection catalog entries }
    post:
      tags: [Connections]
      summary: Create or update a saved reusable connection
      description: Saved connections can be referenced from pipeline source/sink/transform specs and DAG nodes with `connection` or `connection_ref`; inline config overrides saved config.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name, kind, type, config]
              properties:
                name: { type: string }
                kind: { type: string, enum: [source, sink, transform] }
                type: { type: string }
                config: { type: object }
                test: { type: boolean, default: false }
                open: { type: boolean, default: true }
      responses:
        '200': { description: Saved connection with masked config and optional test result }

  /connections/{name}:
    get:
      tags: [Connections]
      summary: Get a saved connection with secret fields masked
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Connection entry }
        '404': { description: Connection not found }
    put:
      tags: [Connections]
      summary: Update a saved connection
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Saved connection }
    delete:
      tags: [Connections]
      summary: Delete a saved connection
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Deleted }

  /connections/{name}/test:
    post:
      tags: [Connections]
      summary: Test a saved connection and update its health status
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Test result and updated health status }
        '400': { description: Build/open failed }
        '404': { description: Connection not found }

  /connections/{name}/context:
    get:
      tags: [Connections]
      summary: Get saved connection descriptor, health, recommendations, and source/sink introspection
      description: Returns masked connection metadata, connector descriptor, recommended batch/checkpoint/schedule settings, and best-effort metadata such as source database/table/columns, Kafka topics/partitions, file/HTTP sample records, sink target table/index schema, or File/S3 output targets.
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Connection context }
        '404': { description: Connection not found }

  /connections/test:
    post:
      tags: [Connections]
      summary: Test a source/sink connection and optionally get sample records
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string, enum: [source, sink, transform] }
                type: { type: string }
                config: { type: object }
                open: { type: boolean, default: true }
      responses:
        '200': { description: Test result with optional sample records }

  /connectors/descriptors:
    get:
      tags: [Connectors]
      summary: List Connector Descriptor v1 records merged from registry, config schema, maturity, and readiness metadata
      description: Maturity levels are production, beta, experimental, and dev-only. Each descriptor also includes readiness gates for schema/preflight, checkpoint or replay behavior, and e2e evidence.
      responses:
        '200': { description: Connector descriptors for UI forms, preflight, and connector test kits }

  /ai/context:
    get:
      tags: [AI]
      summary: Get the AI context pack generated from descriptors, schema, component docs, boundaries, and examples
      responses:
        '200': { description: AI context pack }

  /ai/generate:
    post:
      tags: [AI]
      summary: Generate an ordinary pipeline/DAG YAML draft with validation and review metadata
      description: AI generation never starts a pipeline and must still pass validate/preflight and user confirmation.
      responses:
        '200': { description: Generated YAML plus context_pack_version, validation, and review fields }

  /transforms/dry-run:
    post:
      tags: [Transforms]
      summary: Dry-run transforms against a sample record
      description: Returns `record` for backward-compatible single-output callers and `records`/`output_count` for BatchTransform outputs such as flat_map/udtf. Record-level transform failures may be returned in `errors` with `partial_error=true`.
      responses:
        '200': { description: Transformed record or records }

  /specs/validate:
    post:
      tags: [Specs]
      summary: Validate a pipeline spec and return preflight warnings, readiness, and recommendations
      responses:
        '200': { description: Validation result with optional preflight.recommendations config patches }

  /specs/reload:
    post:
      tags: [Specs]
      summary: Reload specs from disk
      responses:
        '200': { description: Reloaded }

  /plugins:
    get:
      tags: [Plugins]
      summary: List registered plugins
      description: Returns built-in connector types, installed WASM plugins, typed schemas, metadata, and the current `plugin_abi` contract (`openetl.plugin.abi/v1`).
      responses:
        '200': { description: Plugin list }

  /plugins/schema:
    get:
      tags: [Plugins]
      summary: Get config field schemas for all plugins
      responses:
        '200': { description: Plugin schemas }

  /plugins/install:
    post:
      tags: [Plugins]
      summary: Install a WASM plugin (multipart upload)
      description: Accepts `wasm`, `name`, `kind`, `version`, and optional text field `manifest`. Explicit Plugin ABI v1 manifests are validated before the WASM file is loaded; legacy uploads without a manifest are reported as `manifest_validated=false`.
      responses:
        '200': { description: Installed }

  /plugins/compile:
    post:
      tags: [Plugins]
      summary: Compile and optionally install a transform plugin from TypeScript source
      description: Bundles TypeScript with pre-installed esbuild, then uses a pre-installed extism-js compiler when available. Accepts optional Plugin ABI v1 `manifest` text field. Server-side npx fallback for extism-js is disabled unless explicitly enabled and configured for a trusted package. Source and sink plugins must be compiled offline and uploaded as `.wasm` through `/plugins/install`.
      responses:
        '200': { description: Compiled and installed, or source returned with offline compile guidance }
        '400': { description: Invalid request, including source/sink compile attempts }

  /plugins/dry-run:
    post:
      tags: [Plugins]
      summary: Dry-run an installed transform plugin against a sample record
      description: Returns `records` and `output_count` for multi-output WASM/plugin transforms. `record` and `output` contain the first output for backward-compatible clients.
      responses:
        '200': { description: Plugin transform dry-run result }

  /schemas:
    get:
      tags: [Schemas]
      summary: List registered data schemas
      responses:
        '200': { description: Schema list }

  /schemas/{name}:
    get:
      tags: [Schemas]
      summary: Get a specific schema
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Schema }

  /workers:
    get:
      tags: [Workers]
      summary: List registered workers
      responses:
        '200': { description: Worker list }

  /audit:
    get:
      tags: [Audit]
      summary: List audit events
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        '200': { description: Audit events }

  /settings:
    get:
      tags: [Settings]
      summary: Get system settings
      responses:
        '200': { description: Settings }
    put:
      tags: [Settings]
      summary: Update system settings
      responses:
        '200': { description: Updated }
