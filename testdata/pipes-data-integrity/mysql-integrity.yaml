name: "integrity-mysql"
source:
  type: mysql_snapshot_cdc
  config:
    host: "host.docker.internal"
    port: 13306
    user: "sync_user"
    password: "sync_password_123"
    database: "integrity_src"
    tables: ["orders", "audit_log"]
    # audit_log has no primary key: snapshot it with the synthetic _row_hash key
    # instead of silently leaving its historical rows behind.
    no_pk_snapshot: "hash"
    limit: 500

sink:
  type: mysql
  config:
    host: "host.docker.internal"
    port: 13306
    user: "sync_user"
    password: "sync_password_123"
    database: "integrity_dw"
    batch_mode: "upsert"
    pk_columns_from_metadata: true
    auto_create: true
    schema_drift: "add_columns"

batch_size: 100
checkpoint_interval_sec: 1
backpressure_buffer: 64
