name: "cdc-upsert-to-myduck-pg"
source:
  type: mysql_cdc
  config:
    host: "host.docker.internal"
    port: 13306
    user: "sync_user"
    password: "sync_password_123"
    database: "dzh3136_go"
    server_id: 4302
    tables:
      - "myduck_e2e_customers"

transforms:
  - type: identity
    config: {}

sink:
  type: postgres
  config:
    host: "etl-myduck"
    port: 5432
    user: "postgres"
    password: "myduck123"
    database: "postgres"
    schema: "public"
    table: "myduck_pg_customers"
    batch_mode: "upsert"
    pk_columns:
      - "id"
    auto_create: true
    schema_drift: "ignore"

batch_size: 1
checkpoint_interval_sec: 1
backpressure_buffer: 20

retry:
  max_attempts: 3
  initial_interval_ms: 100
  max_interval_ms: 1000

dlq:
  enable: true