name: Release Beta Container
# Tag pushes are built/certified/published once by release.yml.
# This retry consumes the previously certified bundle.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing beta tag with a certified candidate bundle
        required: true
        type: string
permissions:
  contents: read
  packages: write
jobs:
  publish:
    name: Repromote preserved beta bytes
    runs-on: ubuntu-latest
    env:
      P1_CANDIDATE_DIR: /tmp/openetl-candidate
      REQUESTED_TAG: ${{ inputs.tag }}
    steps:
      - name: Resolve beta tag
        run: |
          case "$REQUESTED_TAG" in
            v*-beta*) ;;
            *) echo "an existing beta tag is required" >&2; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Download immutable certified bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$P1_CANDIDATE_DIR"
          gh release download "$REQUESTED_TAG" --pattern candidate-bundle.tar.gz --pattern candidate-bundle.sha256 --dir "$P1_CANDIDATE_DIR"
          cd "$P1_CANDIDATE_DIR"
          sha256sum -c candidate-bundle.sha256
          tar -xzf candidate-bundle.tar.gz
      - name: Verify certification before mutation
        run: python3 hack/release_candidate.py verify --dir "$P1_CANDIDATE_DIR"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Repromote without rebuilding
        run: |
          P1_DESTINATION="ghcr.io/${GITHUB_REPOSITORY,,}:${REQUESTED_TAG#v}"
          python3 hack/release_candidate.py promote --dir "$P1_CANDIDATE_DIR" --destination "$P1_DESTINATION" --release-tag "$REQUESTED_TAG" --image-only
          P1_IMAGE_ID="$(python3 -c 'import json,os;print(json.load(open(os.environ["P1_CANDIDATE_DIR"]+"/candidate.json"))["image"]["id"])')"
          docker tag "$P1_IMAGE_ID" "ghcr.io/${GITHUB_REPOSITORY,,}:$REQUESTED_TAG"
          docker push "ghcr.io/${GITHUB_REPOSITORY,,}:$REQUESTED_TAG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: beta-promotion-${{ github.run_id }}
          path: ${{ env.P1_CANDIDATE_DIR }}/promotion.json
          if-no-files-found: error
