name: Test Gate

# Reusable test gate (IT-1/T1.1, roadmap RA-4).
#
# Callers:
#   - test.yml                    (push main / pull_request -> default checkout)
#   - release.yml                 (tag push -> gate runs synchronously on the tag commit)
#   - release-beta-container.yml  (tag push, or workflow_dispatch passing `ref`)
#
# `gate-passed` is the single aggregated verdict. GitHub Actions does NOT fail a
# `needs` chain when an upstream job is skipped, so this job re-asserts every
# upstream `result == "success"` explicitly. Skipped/cancelled jobs fail the
# gate (spec 交付约束 1: skip is never pass) unless a job id is listed in the
# allowlist AND documented with a reason in docs/release-checklist.md section 1b.

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref the gate must certify. Empty = caller's ref (tag-aware)."
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: go vet
        run: go vet ./...

  connector-evidence:
    name: Connector Evidence Manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Structural evidence check
        run: bash ./hack/check-connector-evidence.sh
      - name: Strict evidence gate on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: bash ./hack/check-connector-evidence.sh -strict -commit "$(git rev-parse HEAD)"

  unit-test:
    name: Unit Tests (-race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Run unit tests
        run: go test -race -count=1 ./internal/etl/... ./internal/logic/...
      - name: Plaintext-secret scanner escaping and failure cases
        run: python3 hack/test-plaintext-secrets.py

  # P5: production checklist gate — release assets, profile smoke, health unit
  # coverage, and storage matrix with explicit SKIP (never silent green).
  production-gate:
    name: Production Gate (P5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Business health + alert drop unit tests
        run: go test -race -count=1 ./internal/etl/telemetry/... ./internal/etl/alert/...
      - name: Release asset scan
        run: bash ./hack/check-release-assets.sh
      - name: Production profile smoke
        run: bash ./hack/e2e-production-profile.sh
      - name: Runtime smoke
        run: bash ./hack/e2e-runtime-smoke.sh
      - name: SQLite backup/retention smoke
        run: bash ./hack/e2e-backup-restore-sqlite.sh
      - name: SQLite actual secret artifacts
        env:
          SECRET_ARTIFACT_OUTPUT: ${{ runner.temp }}/secret-artifacts
        run: bash hack/e2e-secret-artifacts.sh sqlite
      - name: SQLite full backup content and export memory
        env:
          BACKUP_VOLUME_OUTPUT: ${{ runner.temp }}/backup-volume
        run: bash hack/e2e-backup-volume.sh sqlite
      - uses: actions/upload-artifact@v4
        with:
          name: backup-volume-sqlite
          path: ${{ runner.temp }}/backup-volume/sqlite
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: secret-artifacts-sqlite
          path: ${{ runner.temp }}/secret-artifacts/sqlite
          if-no-files-found: error
          retention-days: 7

  storage-mysql:
    name: Storage MySQL (P5 matrix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: MySQL storage e2e (self-contained container)
        run: bash ./hack/e2e-storage-mysql.sh
      - name: MySQL actual secret artifacts
        env:
          SECRET_ARTIFACT_OUTPUT: ${{ runner.temp }}/secret-artifacts
        run: bash hack/e2e-secret-artifacts.sh mysql
      - name: MySQL full backup content and export memory
        env:
          BACKUP_VOLUME_OUTPUT: ${{ runner.temp }}/backup-volume
        run: bash hack/e2e-backup-volume.sh mysql
      - uses: actions/upload-artifact@v4
        with:
          name: backup-volume-mysql
          path: ${{ runner.temp }}/backup-volume/mysql
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: secret-artifacts-mysql
          path: ${{ runner.temp }}/secret-artifacts/mysql
          if-no-files-found: error
          retention-days: 7

  storage-postgres:
    name: Storage Postgres (P5 matrix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Postgres storage e2e (self-contained container)
        run: bash ./hack/e2e-storage-postgres.sh
      - name: Postgres actual secret artifacts
        env:
          SECRET_ARTIFACT_OUTPUT: ${{ runner.temp }}/secret-artifacts
        run: bash hack/e2e-secret-artifacts.sh postgres
      - name: Postgres full backup content and export memory
        env:
          BACKUP_VOLUME_OUTPUT: ${{ runner.temp }}/backup-volume
        run: bash hack/e2e-backup-volume.sh postgres
      - uses: actions/upload-artifact@v4
        with:
          name: backup-volume-postgres
          path: ${{ runner.temp }}/backup-volume/postgres
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: secret-artifacts-postgres
          path: ${{ runner.temp }}/secret-artifacts/postgres
          if-no-files-found: error
          retention-days: 7

  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root123456
          MYSQL_DATABASE: dzh3136_go
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      clickhouse:
        image: clickhouse/clickhouse-server:24.3-alpine
        env:
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: dzh123456
          CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
        ports:
          - 8123:8123
          - 9000:9000
        options: >-
          --ulimit nofile=262144:262144
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Wait for ClickHouse
        run: |
          for i in $(seq 1 180); do
            if curl -fsS http://127.0.0.1:8123/ping >/dev/null 2>&1 || \
               curl -fsS http://default:dzh123456@127.0.0.1:8123/ping >/dev/null 2>&1; then
              curl -fsS http://default:dzh123456@127.0.0.1:8123/ \
                --data-binary 'CREATE DATABASE IF NOT EXISTS dzh3136_go'
              exit 0
            fi
            sleep 1
          done

          . ./hack/container-cli.sh
          detect_container_cli
          "$CONTAINER_CLI" ps -a
          cid="$("$CONTAINER_CLI" ps -aq --filter ancestor=clickhouse/clickhouse-server:24.3-alpine | head -n 1)"
          if [ -n "$cid" ]; then
            "$CONTAINER_CLI" logs "$cid" || true
            "$CONTAINER_CLI" exec "$cid" sh -c 'tail -200 /var/log/clickhouse-server/clickhouse-server.err.log 2>/dev/null || true'
          fi
          exit 1
      - name: Run integration tests
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: root123456
          MYSQL_DATABASE: dzh3136_go
          CLICKHOUSE_HOST: 127.0.0.1
          CLICKHOUSE_PORT: 9000
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: dzh123456
          GOPROXY: "direct"
        run: go test -race -count=1 -tags=integration ./internal/etl/...

  # IT-1/T1.4 (RA-7): the migrated primary connector paths run as Go tests
  # with testcontainers; -e2e.strict makes any skip a hard failure.
  connector-e2e:
    name: Connector E2E (Go, tagged paths)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TESTCONTAINERS_RYUK_DISABLED: "true"
      # proxy.golang.org intermittently dies mid-stream on large module zips
      # (pingcap/tidb parser etc.), failing the whole build; on GitHub
      # runners `direct` (github.com) is the reliable path.
      GOPROXY: "direct"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Vet e2e packages (tagged)
        run: go vet -tags=e2e ./internal/etl/e2e/...
      - name: Run connector e2e paths
        run: go test -tags=e2e -count=1 -timeout 40m ./internal/etl/e2e/... -e2e.strict -v

  # IT-3/T3.7: resource-baseline regression gate. WARNING MODE for the first
  # version cycle: valid measurements over budget warn. Failed/missing
  # measurements fail this job and therefore the aggregated gate.
  bench-baseline:
    name: Resource Baseline (warning)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: Verify measurement failure boundaries
        run: PYTHONDONTWRITEBYTECODE=1 python3 hack/test_bench_baseline.py -v
      - name: Measure packaged images, health-ready startup, RSS and offline restore
        run: |
          set -euo pipefail
          CONTAINER_CLI=docker ./hack/bench-baseline.sh --out .bench-out/current 2>&1 | tee baseline-run.log
      - name: Validate complete measurements and apply observation budgets
        run: python3 hack/bench_baseline.py --check .bench-out/current/result.json
      - name: Upload baseline provenance and raw measurement logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-baseline-${{ github.run_id }}
          if-no-files-found: error
          include-hidden-files: true
          path: |
            baseline-run.log
            .bench-out/current/*.json
            .bench-out/current/*.jsonl
            .bench-out/current/*.log

  gate-passed:
    name: Gate Passed (aggregated)
    needs:
      - lint
      - connector-evidence
      - unit-test
      - production-gate
      - storage-mysql
      - storage-postgres
      - integration-test
      - connector-e2e
      - bench-baseline
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Assert every gate job succeeded (skip/cancel is failure)
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          # Exemptions are forbidden by default. Any job id added here must be
          # documented with a per-job reason in docs/release-checklist.md §1b,
          # otherwise the exemption is an undocumented silent skip.
          GATE_ALLOWLIST: ""
        run: |
          echo "$NEEDS_JSON"
          if ! echo "$NEEDS_JSON" | jq -e --arg allowlist "$GATE_ALLOWLIST" '
            ($allowlist | split(",") | map(select(length > 0) | gsub("^\\s+|\\s+$"; ""))) as $allow
            | to_entries
            | all(
                . as $entry
                | $entry.value.result == "success"
                  or ($allow | index($entry.key) != null)
              )
          ' > /dev/null; then
            echo "::error::Test gate failed: every gate job must be 'success'."
            echo "::error::skipped/cancelled jobs are failures unless allowlisted"
            echo "::error::AND documented with a reason in docs/release-checklist.md §1b."
            echo "$NEEDS_JSON" | jq .
            exit 1
          fi
