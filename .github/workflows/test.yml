name: Test

# Thin caller (IT-1/T1.1, roadmap RA-4): the gate jobs live in _gate.yml so
# release workflows can run the exact same set synchronously on a tag commit.
# push/pull_request behavior is unchanged apart from the check-run grouping.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    name: Gate
    uses: ./.github/workflows/_gate.yml
    secrets: inherit
