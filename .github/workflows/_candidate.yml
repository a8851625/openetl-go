name: Certified Candidate

on:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ""
      snapshot:
        type: boolean
        required: false
        default: true
    outputs:
      artifact:
        description: Preserved candidate and all mandatory certification results
        value: ${{ jobs.certified.outputs.artifact }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      P1_CANDIDATE_DIR: /tmp/openetl-candidate
      GORELEASER: /tmp/goreleaser
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install pinned GoReleaser
        run: |
          curl -fsSL --retry 3 https://github.com/goreleaser/goreleaser/releases/download/v1.26.2/goreleaser_Linux_x86_64.tar.gz -o "$RUNNER_TEMP/goreleaser.tar.gz"
          tar -xzf "$RUNNER_TEMP/goreleaser.tar.gz" -C /tmp goreleaser
          "$GORELEASER" --version
      - name: Verify incomplete and mutated candidate rejection
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s hack -p test_release_candidate.py -v
      - name: Build and capture candidate once, without publishing
        env:
          SNAPSHOT_MODE: ${{ inputs.snapshot }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          P1_BUILD_ARGS=()
          if [ "$SNAPSHOT_MODE" = "true" ]; then P1_BUILD_ARGS+=(--snapshot); fi
          python3 hack/release_candidate.py build --dir "$P1_CANDIDATE_DIR" "${P1_BUILD_ARGS[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-built-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.P1_CANDIDATE_DIR }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  cases:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        name:
          - hack/e2e.sh
          - hack/e2e-http-source.sh
          - hack/e2e-mysql-postgres.sh
          - hack/e2e-cdc-mysql.sh
          - hack/e2e-cdc-postgres.sh
          - hack/e2e-snapshot-cdc.sh
          - hack/e2e-clickhouse.sh
          - hack/e2e-snapshot-cdc-clickhouse.sh
          - hack/e2e-kafka.sh
          - hack/e2e-kafka-raw-ods.sh
          - hack/e2e-kafka-multitable-clickhouse.sh
          - hack/e2e-debezium-mysql.sh
          - hack/e2e-postgres-cdc.sh
          - hack/e2e-s3-minio.sh
          - hack/e2e-doris.sh
          - hack/e2e-doris-source-order.sh
          - hack/e2e-path-mysql-cdc-mysql.sh
          - hack/e2e-clickhouse-replay-ordering.sh
          - tagged
    env:
      P1_CANDIDATE_DIR: /tmp/openetl-candidate
      CONTAINER_CLI: docker
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.13"
      - uses: actions/download-artifact@v4
        with:
          name: candidate-built-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.P1_CANDIDATE_DIR }}
      - name: Execute mandatory case on the preserved candidate
        env:
          CASE_NAME: ${{ matrix.name }}
        run: python3 hack/release_candidate.py run --dir "$P1_CANDIDATE_DIR" --name "$CASE_NAME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-case-${{ strategy.job-index }}
          path: ${{ env.P1_CANDIDATE_DIR }}/results/
          if-no-files-found: error
          compression-level: 0

  p1-ui:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        name: [p1-health, p1-references, p1-recovery]
    env:
      P1_CANDIDATE_DIR: /tmp/openetl-candidate
      CONTAINER_CLI: docker
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/download-artifact@v4
        with:
          name: candidate-built-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.P1_CANDIDATE_DIR }}
      - name: Install browser test CLI
        run: npm install --global @playwright/cli@0.1.22
      - name: Run P1 browser regression on the candidate image
        env:
          CASE_NAME: ${{ matrix.name }}
        run: python3 hack/release_candidate.py run --dir "$P1_CANDIDATE_DIR" --name "$CASE_NAME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-case-${{ matrix.name }}
          path: ${{ env.P1_CANDIDATE_DIR }}/results/
          if-no-files-found: error

  certified:
    needs: [build, cases, p1-ui]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      artifact: candidate-certified-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      P1_CANDIDATE_DIR: /tmp/openetl-candidate
      CONTAINER_CLI: docker
    steps:
      - name: Reject every failed, skipped or cancelled prerequisite
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json,os
          results=json.loads(os.environ["RESULTS"])
          assert all(v["result"]=="success" for v in results.values()), results
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.13"
      - uses: actions/download-artifact@v4
        with:
          name: candidate-built-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.P1_CANDIDATE_DIR }}
      - uses: actions/download-artifact@v4
        with:
          pattern: candidate-case-*
          path: ${{ env.P1_CANDIDATE_DIR }}/results
          merge-multiple: true
      - name: Generate post-build evidence, verify runtime binding, and close certification
        run: |
          python3 hack/release_candidate.py emit-evidence --dir "$P1_CANDIDATE_DIR"
          python3 hack/release_candidate.py run --dir "$P1_CANDIDATE_DIR" --name readiness
          python3 hack/release_candidate.py collect --dir "$P1_CANDIDATE_DIR"
          python3 hack/release_candidate.py bundle --dir "$P1_CANDIDATE_DIR"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: candidate-certified-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.P1_CANDIDATE_DIR }}/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
