name: Release
on:
  push:
    tags: ['v*']
jobs:
  gate:
    uses: ./.github/workflows/_gate.yml
    secrets: inherit
  candidate:
    needs: gate
    uses: ./.github/workflows/_candidate.yml
    with:
      ref: ${{ github.ref }}
      snapshot: false
    secrets: inherit
  release:
    name: Promote certified assets
    needs: [gate, candidate]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    env:
      P1_CANDIDATE_DIR: /tmp/openetl-candidate
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Reject failed, skipped or cancelled prerequisites
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json,os
          values=json.loads(os.environ["RESULTS"])
          assert all(v["result"]=="success" for v in values.values()), values
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.candidate.outputs.artifact }}
          path: ${{ env.P1_CANDIDATE_DIR }}
      - name: Verify preserved assets before publication
        run: python3 hack/release_candidate.py verify --dir "$P1_CANDIDATE_DIR"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote tested image and upload tested archives
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          P1_DESTINATION="ghcr.io/${GITHUB_REPOSITORY,,}:${RELEASE_TAG#v}"
          python3 hack/release_candidate.py promote --dir "$P1_CANDIDATE_DIR" --destination "$P1_DESTINATION" --release-tag "$RELEASE_TAG"
          P1_IMAGE_ID="$(python3 -c 'import json,os;print(json.load(open(os.environ["P1_CANDIDATE_DIR"]+"/candidate.json"))["image"]["id"])')"
          docker tag "$P1_IMAGE_ID" "ghcr.io/${GITHUB_REPOSITORY,,}:$RELEASE_TAG"
          docker push "ghcr.io/${GITHUB_REPOSITORY,,}:$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: promotion-${{ github.run_id }}
          path: ${{ env.P1_CANDIDATE_DIR }}/promotion.json
          if-no-files-found: error
