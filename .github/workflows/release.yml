name: Release

on:
  push:
    tags:
      - 'v*'

# Build + publish per-platform archives to GitHub Releases, plus a Docker
# image to GHCR. The goreleaser config (.goreleaser.yml) drives the matrix
# and artifact naming; this workflow only sets up Go and runs goreleaser.

env:
  GO_VERSION: "1.24"

jobs:
  # IT-1/T1.2 (roadmap RA-4): the gate runs synchronously on the tag commit
  # before any release artifact is produced. A failing or skipped gate job
  # fails the run here — no Release and no GHCR image can be published.
  gate:
    name: Test Gate
    uses: ./.github/workflows/_gate.yml
    secrets: inherit

  release:
    name: Release
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write       # create GitHub Release + upload assets
      packages: write       # push container image to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # goreleaser needs full history for changelog

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Strict connector evidence gate
        run: bash ./hack/check-connector-evidence.sh -strict -commit "$(git rev-parse HEAD)"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: '~1'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
